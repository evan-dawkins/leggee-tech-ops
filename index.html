<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Simulated technology operations tool for Leggee Elementary: work orders, rooms, staff and equipment inventory. Portfolio demonstration.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-weight='700' font-size='19' text-anchor='middle' fill='%23FFC425'%3EL%3C/text%3E%3C/svg%3E">
<title>Leggee Tech Ops</title>
<style>
/* Shape rule: sheets and tables are square; every control, chip and room plate is 4px; circles only for connection-path points and setup step numbers. */
:root{
  --black:#000000; --ink:#1F1F1D; --muted:#5C5C57; --faint:#6E6E68;
  --yellow:#FFC425; --yellow-deep:#D9A100; --yellow-soft:#FFF4CC;
  --field:#F2F2EF; --paper:#FFFFFF; --rule:#D9D9D4; --rule-strong:#BDBDB7; --hover:#F7F7F4;
  --red:#B3261E; --red-soft:#FCE8E6; --amber:#8A5300; --amber-soft:#FCEFD9;
  --blue:#1F4E96; --blue-soft:#E4ECF8; --green:#1F6B35; --green-soft:#E3F2E6;
  --gray-soft:#ECECE8;
  --display:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--field);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:0;margin:0}

/* ---------- Frame ---------- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--black);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:0 0 14px}
.side::before{content:"";display:block;flex:none;height:10px;margin-bottom:16px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 9px,#000 9px 18px)}
.brand{padding:0 18px 16px}
.brand a{text-decoration:none;color:#fff;display:block}
.brand b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1}
.brand b span{color:var(--yellow)}
.brand small{display:block;color:#A8A8A2;font-size:13px;margin-top:3px}
.nav{list-style:none;margin:0;padding:0}
.nav a{display:block;padding:9px 18px;color:#EDEDE8;text-decoration:none;font-size:15px;border-left:4px solid transparent}
.nav a:hover{background:#1C1C1A;color:#fff}
.nav a[aria-current="page"]{background:var(--yellow);color:#000;font-weight:700;border-left-color:#000}
.nav .sep{height:1px;background:#2E2E2B;margin:8px 18px}
.side-foot{margin-top:auto;padding:12px 18px 0;border-top:1px solid #2E2E2B;font-size:13px;color:#A8A8A2;display:grid;gap:8px}
.reset{background:transparent;border:1px solid #3A3A37;color:#EDEDE8;border-radius:4px;padding:6px 10px;cursor:pointer;text-align:left;font-size:13.5px}
.reset:hover{border-color:#77776F}
.reset.arm{background:var(--red);border-color:var(--red);color:#fff}
.sim{font-size:12px;color:#A8A8A2;line-height:1.35}

main{padding:22px 32px 48px;min-width:0;max-width:1240px}

/* ---------- Page header ---------- */
.crumbs{font-size:14px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
.ph{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.ph h1{font-size:28px;line-height:1.15}
.ph>div:first-child{flex:1 1 420px;min-width:0}
.ph .sub{color:var(--muted);margin-top:4px;font-size:15px;max-width:78ch}
.ph .ctx{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:15px}
.ctx.sepd>*+*{border-left:1px solid var(--rule-strong);padding-left:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.acts .err{flex-basis:100%;text-align:right}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);border-radius:4px;padding:7px 14px;cursor:pointer;font-size:14.5px;font-weight:600;text-decoration:none;line-height:1.3;min-height:36px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--yellow);border:2px solid #000;color:#000;box-shadow:3px 3px 0 #000;margin:0 3px 3px 0}
.btn.primary:hover{background:#FFD24F}
.btn.primary:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px;padding-left:6px;padding-right:6px}
.btn.quiet:hover{text-decoration-color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.btn.small{min-height:30px;padding:4px 10px;font-size:13.5px}

/* ---------- Messages ---------- */
.flash{border:1px solid var(--rule);border-left:5px solid var(--green);background:var(--paper);padding:8px 12px;margin-bottom:14px;font-size:14.5px}
.flash.warn{border-left-color:var(--amber)}
.err{color:var(--red);font-size:14px;font-weight:600}
.err:empty{display:none}
.empty{color:var(--muted);padding:10px 0;font-size:14.5px}

/* ---------- Chips and plates ---------- */
.plate{display:inline-block;background:#000;color:var(--yellow);font-family:var(--display);font-weight:700;font-size:15px;line-height:1;padding:5px 8px;border-radius:4px;min-width:48px;text-align:center;white-space:nowrap;max-width:132px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
a.plate{text-decoration:none}
.plate.big{font-size:28px;padding:8px 12px;min-width:76px;max-width:none}
.chip{display:inline-block;border-radius:4px;padding:2px 7px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1.35}
.p-High{background:var(--red-soft);color:var(--red)}
.p-Medium{background:var(--amber-soft);color:var(--amber)}
.p-Low{background:var(--gray-soft);color:var(--muted)}
.s-New{background:var(--yellow-soft);color:#5A4300}
.s-InProgress{background:var(--green-soft);color:var(--green)}
.s-Waiting{background:var(--blue-soft);color:var(--blue)}
.s-Resolved{background:var(--gray-soft);color:var(--ink)}
.s-Closed{background:transparent;color:var(--muted);border:1px solid var(--rule-strong)}
.a-Deployed{background:var(--green-soft);color:var(--green)}
.a-InStock{background:var(--yellow-soft);color:#5A4300}
.a-Received,.a-Configuring{background:var(--amber-soft);color:var(--amber)}
.a-InRepair{background:var(--blue-soft);color:var(--blue)}
.a-Retired{background:transparent;color:var(--muted);border:1px solid var(--rule-strong)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:14px;color:var(--muted);min-height:34px}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:#000;color:var(--yellow);font-weight:700}
.field{border:1px solid var(--rule-strong);background:var(--paper);border-radius:4px;padding:7px 10px;font-size:14.5px;min-height:36px}
.toolbar .grow{flex:1;min-width:220px}

/* ---------- Sheets and sections ---------- */
.sheet{background:var(--paper);border:1px solid var(--rule);margin-bottom:16px}
.sec{padding:14px 18px}
.sec+.sec{border-top:1px solid var(--rule)}
.sec>h2{font-size:18px;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec>h2 .n{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--muted)}
.sec>h2 .hint{font-family:var(--sans);font-size:13.5px;font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.grouphead{font-family:var(--display);font-size:17px;font-weight:600;margin:20px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.grouphead:first-child{margin-top:0}
.grouphead .n{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--muted)}
.grouphead .stops{font-family:var(--sans);font-size:13.5px;font-weight:400;color:var(--muted)}

/* ---------- Work list (queue rows) ---------- */
.wl{background:var(--paper);border:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:78px 96px minmax(0,1.7fr) minmax(0,.9fr) 160px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.wrow:first-child{border-top:0}
.wrow:hover{background:var(--hover)}
.wrow.r-High{box-shadow:inset 5px 0 0 var(--red)}
.wrow .plate{max-width:92px}
.wrow .what b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .what span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .eq{font-size:14px;min-width:0}
.wrow .eq span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .eq .mono{color:var(--muted)}
.wrow .state{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:var(--muted);text-align:right}

.wl.inset{margin:0 -18px;border-left:0;border-right:0;border-bottom:0}
.wl.inset .wrow{grid-template-columns:72px 90px minmax(0,1fr) 150px}
.wl.inset .eq{display:none}
.wl.noplate .wrow{grid-template-columns:72px minmax(0,1fr) 150px}
.wl.noplate .pl{display:none}
/* ---------- Tables ---------- */
.tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--rule)}
.sec .tblwrap{border:0;margin:0 -18px}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13.5px;padding:8px 12px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--paper)}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.sec .tbl th:first-child,.sec .tbl td:first-child{padding-left:18px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl a{font-weight:600}
.tbl a.mono,.tbl td.mono{white-space:nowrap}
.tbl .grp td{background:var(--field);font-weight:600;font-size:13.5px;color:var(--muted);padding-top:6px;padding-bottom:6px}
.tbl tbody tr.grp:hover td{background:var(--field)}

/* ---------- Key facts ---------- */
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:2px 0 16px;padding:12px 18px;background:var(--paper);border:1px solid var(--rule)}
.facts div{min-width:120px}
.facts dt,.kv dt{color:var(--muted);font-size:13.5px}
.facts dd{margin:2px 0 0;font-weight:600}
.facts dl{margin:0}
dl.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:5px 12px;margin:0;font-size:14.5px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.lines{margin:0;padding:0;list-style:none}
.lines li{padding:3px 0}

/* ---------- Work order ---------- */
.progress{display:flex;list-style:none;margin:0 0 16px;padding:0;gap:0;font-size:14px;border:1px solid var(--rule);background:var(--paper)}
.progress li{flex:1;padding:7px 12px;color:var(--faint);border-bottom:3px solid transparent}
.progress li+li{border-left:1px solid var(--rule)}
.progress li.done{color:var(--ink)}
.progress li.done::before{content:"✓ ";color:var(--green);font-weight:700}
.progress li.now{color:#000;font-weight:700;border-bottom-color:var(--yellow);background:var(--yellow-soft)}
.progress li.skip{color:var(--faint)}
blockquote.report{margin:0 0 6px;padding:2px 0 2px 12px;border-left:4px solid var(--yellow);font-size:15.5px;white-space:pre-wrap}
.by{color:var(--muted);font-size:14px;margin:0 0 12px}
label.lbl{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
label.lbl .hint{font-weight:400;color:var(--muted)}
textarea{width:100%;min-height:60px;border:1px solid var(--rule-strong);border-radius:4px;padding:8px 10px;background:var(--paper);resize:vertical;font-size:15px;line-height:1.4}
textarea[readonly],input[readonly]{background:var(--field)}
.checkhead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;font-size:13.5px;font-weight:600;color:var(--muted);padding:0 0 4px;border-bottom:1px solid var(--rule-strong)}
.checkhead span:first-child{padding-left:28px}
.checks{list-style:none;margin:0;padding:0}
.check{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--rule)}
.check:first-child{border-top:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input[type=checkbox]{flex:none;margin:2px 0 0;width:18px;height:18px;accent-color:#000}
.check.done label span{color:var(--muted)}
.check input.res{border:1px solid var(--rule-strong);border-radius:4px;padding:6px 9px;background:var(--paper);font-size:14.5px;width:100%;min-height:34px}
.check.done input.res{border-color:var(--rule)}
details.more{margin-top:8px}
details.more>summary{cursor:pointer;font-weight:600;font-size:14.5px;padding:4px 0;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-block;width:16px;text-align:center;font-weight:700}
details.more[open]>summary::before{content:"−"}
.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.inline .field{flex:1;min-width:200px}
.closebox{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.closebox input{width:18px;height:18px;accent-color:#000}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:5px 0;border-top:1px solid var(--rule);font-size:14.5px}
.timeline li:first-child{border-top:0}
.timeline time{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.hist li:first-child{border-top:0}
.hist time{display:block;color:var(--muted);font-size:13px}

/* ---------- Connection path: the cable run ---------- */
.path{list-style:none;margin:4px 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:4px;background:#000}
.path li{position:relative;padding-left:38px;margin:0 0 2px}
.path .node{position:absolute;left:5px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--yellow);border:3px solid #000}
.path button,.path .stat{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 9px;font-size:14.5px}
.path button{cursor:pointer}
.path button:hover{border-color:var(--rule-strong);background:var(--hover)}
.path .k{display:block;font-size:13.5px;color:var(--muted)}
.path .v{display:block;font-family:var(--mono);font-size:14px;font-weight:600}
.path li.found .node{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.path li.found button{border-color:var(--red);background:var(--red-soft)}
.path .found-tag{margin-left:8px;color:var(--red);font-weight:700}
.pathhint{color:var(--muted);font-size:13.5px;margin:0 0 6px}

/* ---------- Forms ---------- */
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:600}
.form label .hint{font-weight:400;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--rule-strong);background:var(--paper);border-radius:4px;padding:7px 10px;font-size:15px;font-weight:400;min-height:36px;width:100%}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end}
.form .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.form fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
.form legend{font-family:var(--display);font-weight:600;font-size:17px;padding:0;margin-bottom:2px}
.form .tick{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14.5px}
.form .tick input{width:18px;height:18px;min-height:0;accent-color:#000}
.note{color:var(--muted);font-size:13.5px;margin:6px 0 0}

/* ---------- Equipment setup steps ---------- */
.setup{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.setup>li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--rule);color:var(--faint)}
.setup>li:first-child{border-top:0}
.setup .num{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;font-family:var(--display)}
.setup>li.done{color:var(--ink)}
.setup>li.done .num{background:#000;border-color:#000;color:var(--yellow)}
.setup>li.now{color:var(--ink)}
.setup>li.now .num{background:var(--yellow);border-color:#000;color:#000}
.setup .when{color:var(--muted);font-size:13.5px}
.setup .form{margin-top:10px}
.seq{display:flex;flex-wrap:wrap;gap:6px 0;list-style:none;margin:0 0 16px;padding:0;font-size:14px}
.seq li{padding:4px 10px 4px 0;color:var(--muted)}
.seq li b{color:#000;background:var(--yellow);border-radius:50%;display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;font-size:12px;margin-right:5px;font-family:var(--display)}

/* ---------- People list ---------- */
.people{list-style:none;margin:0;padding:0}
.people li{padding:6px 0;border-top:1px solid var(--rule);font-size:14.5px}
.people li:first-child{border-top:0}
.people a{font-weight:600}
.people span{display:block;color:var(--muted);font-size:13.5px}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .grid2{grid-template-columns:minmax(0,1fr) 320px}
  .wrow{grid-template-columns:72px 90px minmax(0,1.7fr) minmax(0,.8fr) 146px}
}
@media (max-width:1020px){
  .grid2{grid-template-columns:1fr}
  .wrow{grid-template-columns:72px 90px minmax(0,1fr) 140px}
  .wrow .eq{display:none}
  .wrow .what b{white-space:normal}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:0 0 10px}
  .brand{padding:0 14px 8px}
  .nav{display:flex;overflow-x:auto}
  .nav a{border-left:0;border-bottom:4px solid transparent;padding:8px 12px;white-space:nowrap}
  .nav .sep{display:none}
  .side-foot{flex-direction:row;display:flex;flex-wrap:wrap;align-items:center;padding:8px 14px 0}
  main{padding:16px}
  .wrow{grid-template-columns:64px minmax(0,1fr);row-gap:4px}
  .wrow .pri{grid-row:1}
  .wrow .state{grid-column:2;align-items:flex-start;flex-direction:row;gap:8px}
  .form .row,.form .row3{grid-template-columns:1fr}
  .check{grid-template-columns:1fr}
  .checkhead{display:none}
  .check input.res::placeholder{color:var(--muted)}
  .timeline li{grid-template-columns:1fr}
}


/* ---------- Scoreboard strip (queue) ---------- */
.board{display:flex;background:#000;color:#fff;margin:0 0 16px;border-radius:4px;overflow:hidden}
.board>div{flex:1;display:flex;align-items:baseline;gap:10px;padding:10px 18px}
.board>div+div{border-left:1px solid #2E2E2B}
.board b{font-family:var(--display);font-size:32px;line-height:1;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.board span{font-size:14px;color:#D6D6D0}
.board .hot b{color:#FF7A6E}

/* ---------- Asset tag label (equipment pages) ---------- */

    const inner = `<span class="k">${H(p.k)}${found?`<span class="found-tag">Problem found here</span>`:""}</span><span class="v">${p.ref && p.ref!==selfId && !clickable ? `<a href="#/asset/${H(p.ref)}">${H(p.v)}</a>` : H(p.v)}</span>`;
    return `<li class="${found?"found":""}"><span class="node" aria-hidden="true"></span>${clickable
      ? `<button type="button" data-act="fault" data-i="${i}" ${locked?"disabled":""} aria-pressed="${found}">${inner}</button>`
      : `<div class="stat">${inner}</div>`}</li>`; }).join("")}</ol>`;
}
// Decorative barcode drawn from the tag text so each label looks unique (not a real symbology)
function barcode(tag){
  let x = 0, bars = "";
  const unit = w => { const r = `<rect x="${x}" y="0" width="${w}" height="32"/>`; return r; };
  bars += unit(2); x += 3; bars += unit(1); x += 3;
  for (const ch of tag){ const n = ch.charCodeAt(0);
    for (let k = 0; k < 4; k++){ const w = 1 + ((n >> k) & 1) + ((n >> (k+3)) & 1 ? 1 : 0); bars += unit(w); x += w + 1 + ((n >> (k+1)) & 1); } }
  bars += unit(1); x += 2; bars += unit(2); x += 2;
  return `<svg viewBox="0 0 ${x} 32" width="${x*1.15}" height="32" aria-hidden="true" focusable="false">${bars}</svg>`;
}

  const dp = ensureDeploy(a), steps = deploySteps(a), cur = steps.find(s => !dp.done[s]), wo = deployWO(a);
  return `<div class="sheet"><section class="sec"><h2>Equipment setup <span class="n">${steps.filter(s=>dp.done[s]).length} of ${steps.length} done${wo?`, for <a class="mono" href="#/wo/${wo}">${wo}</a>`:""}</span></h2>
    <ol class="setup">${steps.map((s,i)=>`<li class="${dp.done[s]?"done":s===cur?"now":""}"><span class="num">${dp.done[s]?"✓":i+1}</span><div><b>${STEP_LABEL[s]}</b>
      ${dp.done[s]?` <span class="when">${dp.done[s]==="seed"?"already done":H(when(dp.done[s]))}</span>`:""}${s===cur?stepForm(a,s):""}</div></li>`).join("")}</ol></section></div>`;
}
function dpDone(a, step, summary, msg, fn){
  fn(); a.deploy.done[step] = Date.now();
  logEv(summary, {assets:[a.id, ...(a.conn?[a.conn]:[])], loc:a.loc, staff:a.staff, wo:deployWO(a)});
  save(); flash(msg); route();
}
function deployAction(act, a){
  const g = id => (document.getElementById(id).value || "").trim(), err = document.getElementById("dp-err");
  ensureDeploy(a);
  if (act==="dp-verify"){
    if (g("dp-serial").toUpperCase() !== String(a.serial).toUpperCase()){ err.textContent = "The serial number does not match this equipment record. Check the label on the device."; return; }
    if (!document.getElementById("dp-tag").checked){ err.textContent = `Put the ${a.id} tag label on the device, then tick the box.`; return; }
    dpDone(a, "verify", `Verified serial ${a.serial} and applied tag label ${a.id}`, "Serial checked and tag applied.", () => { a.status = "In Stock"; });
  }
  if (act==="dp-configure"){
    const p = g("dp-profile"), os = g("dp-os");
    dpDone(a, "configure", `Applied ${p} profile (${os}): ${PROFILES[p].length} apps`, `${p} software recorded.`, () => { a.profile = p; a.os = os; a.software = PROFILES[p].slice(); a.status = "Configuring"; });
  }
  if (act==="dp-network"){
    const host = g("dp-host").toUpperCase(), mac = g("dp-mac").toUpperCase(), mode = g("dp-mode"), jack = g("dp-jack").toUpperCase(), sw = g("dp-sw"), port = g("dp-port");
    if (!host){ err.textContent = "Enter a hostname for this device."; return; }
    if (mac && !/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(mac)){ err.textContent = "That MAC address isn't in the right format. Use six pairs separated by colons, like F8:B4:6A:12:34:56."; return; }
    if (mode!=="Wi-Fi DHCP" && (!jack || !sw || !port)){ err.textContent = "A wired device needs a wall jack, a switch and a switch port."; return; }
    const pn = (port.match(/(\d+)$/)||[])[1];
    const swHost = sw && S.assets[sw] ? S.assets[sw].net.host : "";
    dpDone(a, "network", `Network recorded: ${host}, VLAN ${g("dp-vlan")}${jack?`, jack ${jack} to ${swHost} ${port}`:", Wi-Fi"}`, "Network details saved.", () => {
      a.net = {host, mac:mac||null, mode, ip:g("dp-ip")||null, vlan:g("dp-vlan"), jack:jack||null, sw:sw||null, port:port||null, patch:pn?`PP${Math.ceil(pn/24)}-${pn}`:null};
      if (a.status==="Received") a.status = "In Stock"; });
  }
  if (act==="dp-assign"){
    const loc = g("dp-loc"), st = g("dp-staff") || null, conn = g("dp-conn") || null;
    if (!loc){ err.textContent = "Choose the room this device is going to."; return; }
    dpDone(a, "assign", `Assigned ${a.id} to ${st?S.staff[st].name+", ":""}${locLabel(L(loc))}${conn?`, connected to ${conn}`:""}`, `Assigned to ${st?S.staff[st].name+", ":""}${locLabel(L(loc))}.`, () => { a.loc = loc; a.staff = st; a.conn = conn; });
  }
  if (act==="dp-deploy"){
    const boxes = [...document.querySelectorAll(".dp-chk")];
    if (!boxes.every(b => b.checked)){ err.textContent = "Check each item with the user before marking the device deployed."; return; }
    dpDone(a, "install", `Deployed ${a.id} (${a.model}) to ${a.staff?S.staff[a.staff].name+", ":""}${locLabel(L(a.loc))}`, `Device deployed to ${locLabel(L(a.loc))}.`, () => { a.status = "Deployed"; });
  }
}
function deployOrderHTML(w){

/* ============ REPAIR (inside a work order) ============ */
function repairHTML(w, a){
  if (w.status!=="In Progress" || !a || a.status==="Retired") return "";
  const stock = Object.values(S.assets).filter(x => x.status==="In Stock" && x.type===a.type && x.id!==a.id);
  const swap = stock.length ? `<details class="more" open><summary>Swap equipment</summary><div class="form nested"><div class="row">
      <label>Replacement from Tech Storage<select id="sw-new">${stock.map(x=>`<option value="${H(x.id)}">${H(x.id)}, ${H(x.model)}${x.note?` (${H(x.note)})`:""}</option>`).join("")}</select></label>
      <label>Old ${H(a.type.toLowerCase())} goes to<select id="sw-old"><option value="In Repair">Repair (keep it)</option><option value="Retired">Retired (dispose)</option></select></label></div>
      <div class="err" id="sw-err" role="alert"></div>
      <div class="btns"><button class="btn" data-act="swap">Swap ${H(a.id)} for the replacement</button></div>
      <p class="note flush">The replacement takes over the room, person and connections. Both devices record the swap.</p></div></details>`
    : `<p class="empty">No spare ${H(a.type.toLowerCase())} in Tech Storage. <a href="#/receive">Receive one</a> to swap it.</p>`;
  const part = a.cls==="computer" ? `<details class="more"><summary>Replace a part</summary><div class="form nested"><div class="row3">
      <label>Part<select id="pt-comp">${PARTS.map(p=>`<option>${p}</option>`).join("")}</select></label>
      <label>Old<input id="pt-old" placeholder="Example: 8 GB"></label>
      <label>New<input id="pt-new" placeholder="Example: 16 GB"></label></div>
      <div class="err" id="pt-err" role="alert"></div>
      <div class="btns"><button class="btn" data-act="part">Record part replacement</button></div>
      <p class="note flush">RAM, SSD and processor changes update the device's hardware list.</p></div></details>` : "";
  return `<section class="sec"><h2>Repair <span class="hint">Swap the device or replace a part</span></h2>${swap}${part}</section>`;
}
function swapAction(w){
  const old = S.assets[w.asset], nw = S.assets[val("sw-new")], to = val("sw-old");
  if (!nw){ document.getElementById("sw-err").textContent = "Choose a replacement from Tech Storage."; return; }
  nw.loc = old.loc; nw.staff = old.staff; nw.conn = old.conn || null;
  Object.values(S.assets).forEach(x => { if (x.conn===old.id) x.conn = nw.id; });
  if (old.net && old.net.jack && nw.net){ ["jack","patch","sw","port"].forEach(k => { nw.net[k] = old.net[k]; old.net[k] = null; }); }
  nw.status = "Deployed"; nw.deploy = Object.assign(nw.deploy || {done:{}}, {wo:w.id}); nw.deploy.done.install = Date.now();
  old.status = to; old.staff = null; old.loc = "107"; old.conn = null; if (to==="Retired") old.retired = `Replaced under ${w.id}`;
  w.replacedWith = nw.id;
  w.actions = (w.actions ? w.actions.trim()+"\n" : "") + `Swapped in ${nw.id} from stock. ${old.id} set to ${to}.`;
  logEv(`Swapped ${old.id} for ${nw.id} (${nw.model}); ${old.id} set to ${to}`, {wo:w.id, assets:[old.id, nw.id], loc:w.loc, staff:w.by});
  save(); flash(`Replacement ${nw.id} assigned to ${locLabel(L(nw.loc))}. ${old.id} moved to Tech Storage as ${to==="Retired"?"retired":"in repair"}.`); route();
}
function partAction(w){
  const a = S.assets[w.asset], comp = val("pt-comp"), oldv = val("pt-old").trim(), newv = val("pt-new").trim();
  if (!newv){ document.getElementById("pt-err").textContent = "Describe the new part, like 16 GB."; return; }
  if (a.specs && /GB|TB/i.test(newv)){
    if (comp==="RAM") a.specs = a.specs.replace(/[\d.]+\s?(GB|TB) RAM/i, `${newv.replace(/\s*RAM$/i,"")} RAM`);
    if (comp==="SSD") a.specs = a.specs.replace(/[\d.]+\s?(GB|TB) (SSD|eMMC)/i, `${newv.replace(/\s*SSD$/i,"")} SSD`);
  }
  if (a.specs && comp==="Processor (CPU)"){ const parts = a.specs.split(","); parts[0] = newv; a.specs = parts.map(x=>x.trim()).join(", "); }
  w.actions = (w.actions ? w.actions.trim()+"\n" : "") + `Replaced ${comp}: ${oldv||"old part"} to ${newv}.`;
  logEv(`Part replaced on ${a.id}: ${comp} from ${oldv||"old part"} to ${newv}`, {wo:w.id, assets:[a.id], loc:w.loc, staff:w.by});
  save(); flash(`${comp} replacement recorded on ${a.id}.`); route();
}

    ${staff.length?`<h2 class="grouphead">Staff <span class="n">${staff.length}</span></h2><div class="sheet"><section class="sec"><ul class="people">${staff.map(s=>`<li>${staffLink(s.id)}<span>${H(s.role)}${s.locs[0]?`, ${H(locLabel(L(s.locs[0])))}`:""}</span></li>`).join("")}</ul></section></div>`:""}

function banner(){

  if (notice){ out += `<div class="flash warn" role="status">${H(notice)}</div>`; notice = ""; }

/* ============ ROUTER ============ */
const main = document.getElementById("main");
function route(){
  const h = location.hash || "#/queue";
  let m;
  if ((m = h.match(/^#\/wo\/([A-Z]+-\d+)/))) renderWO(m[1]);
  else if ((m = h.match(/^#\/room\/([^/?]+)/))) renderRoom(decodeURIComponent(m[1]));
  else if ((m = h.match(/^#\/staff\/([^/?]+)/))) renderStaff(decodeURIComponent(m[1]));
  else if ((m = h.match(/^#\/asset\/([^/?]+)/))) renderAsset(decodeURIComponent(m[1]));
  else if (h.startsWith("#/locations")) renderLocations();
  else if (h.startsWith("#/staff")) renderStaffList();
  else if (h.startsWith("#/assets")) renderAssets();
  else if (h.startsWith("#/new")) renderNew();
  else if (h.startsWith("#/search")) renderSearch();
  else if (h.startsWith("#/receive")) renderReceive();
  else if (h==="#/queue" || h.startsWith("#/queue?") || h==="#/" || h==="#") renderQueue();
  else renderNotFound();
  renderNav();
  document.title = (main.querySelector("h1")?.textContent || "Work queue") + " | Leggee Tech Ops";
}
window.addEventListener("hashchange", () => { editRoom = false; route(); window.scrollTo(0,0); });

/* ============ ACTIONS ============ */
const currentWO = () => { const m = (location.hash||"").match(/^#\/wo\/([A-Z]+-\d+)/); return m ? S.wos[m[1]] : null; };
const currentId = re => { const m = (location.hash||"").match(re); return m ? decodeURIComponent(m[1]) : null; };
const val = id => (document.getElementById(id)||{}).value;
main.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a==="tab"){ Q.tab = b.dataset.v; renderQueue(); return; }
  if (a==="group"){ S.ui.group = b.dataset.v; save(); renderQueue(); return; }
  if (a==="search"){ const q = val("sq").trim(); location.hash = q ? `#/search/${encodeURIComponent(q)}` : "#/search"; return; }
  if (a==="editroom"){ editRoom = !editRoom; route(); return; }
  if (a==="saveroom"){
    const id = currentId(/^#\/room\/([^/?]+)/), l = L(id), before = locLabel(l);
    const number = val("r-number").trim(), name = val("r-name").trim();
    if (!name){ document.getElementById("r-err").textContent = "Give the room a name, like 5th grade classroom."; return; }
    commit(`Room details changed: ${before} is now ${number?`Room ${number}`:name} (${name})`, {loc:id}, () => { Object.assign(l, {number, name, type:val("r-type"), wing:val("r-wing")}); editRoom = false; flash(`Room saved as ${number?`Room ${number}`:name}. Everything in it stays linked.`); });
    return;
  }
  if (a==="savestaffloc"){
    const id = currentId(/^#\/staff\/([^/?]+)/), s = S.staff[id], to = val("st-loc"), from = s.locs[0]||"";
    if (to===from){ flash(`${s.name} is already in ${locLabel(L(from))}.`, true); route(); return; }
    const moveEq = document.getElementById("st-move").checked;
    const moved = moveEq ? activeAssets().filter(x => x.staff===id && x.loc===from) : [];
    commit(`${s.name} moved from ${locLabel(L(from))} to ${locLabel(L(to))}${moved.length?` with ${moved.length} assigned items`:""}`, {staff:id, loc:to||from, assets:moved.map(x=>x.id)}, () => {
      s.locs = to ? [to, ...s.locs.slice(1).filter(x=>x!==to)] : []; moved.forEach(x => x.loc = to || "107"); flash(`${s.name} moved to ${locLabel(L(to))}${moved.length?` with ${moved.length} pieces of equipment`:""}.`); });
    return;
  }
  if (a==="move"){
    const id = currentId(/^#\/asset\/([^/?]+)/), x = S.assets[id], loc = val("mv-loc"), st = val("mv-staff") || null;
    if (loc===x.loc && st===(x.staff||null)){ flash("Nothing changed. Pick a different room or person.", true); route(); return; }
    const parts = [];
    if (loc!==x.loc) parts.push(`moved from ${locLabel(L(x.loc))} to ${locLabel(L(loc))}`);
    if (st!==(x.staff||null)) parts.push(`reassigned from ${x.staff?S.staff[x.staff].name:"room equipment"} to ${st?S.staff[st].name:"room equipment"}`);
    commit(`${id} ${parts.join(" and ")}`, {assets:[id], loc, staff:st||x.staff}, () => { x.loc = loc; x.staff = st; flash(`${id} ${parts.join(" and ")}.`); });
    return;
  }
  if (a==="retire"){
    const id = currentId(/^#\/asset\/([^/?]+)/), x = S.assets[id], reason = val("rt-reason"), note = val("rt-note").trim();
    if (!note){ assetErr = "Write what happened before retiring this equipment."; route(); return; }
    commit(`Retired ${id}: ${reason}. ${note}`, {assets:[id], loc:x.loc, staff:x.staff}, () => { x.status = "Retired"; x.retired = `${reason}. ${note}`; x.staff = null; x.loc = "107"; flash(`${id} retired and moved to Tech Storage. Its history is kept.`); });
    return;
  }
  if (a==="createwo"){
    const title = val("nw-title").trim(), loc = val("nw-loc"), report = val("nw-report").trim();
    if (!title || !loc || !report){ nwErr = `Add ${[!title&&"a title",!loc&&"a room",!report&&"what was reported"].filter(Boolean).join(", ")} before creating the work order.`; const keep = {title, report, loc, pri:val("nw-pri"), cat:val("nw-cat"), type:val("nw-type"), by:val("nw-by"), asset:val("nw-asset")};
      renderNew(); ["title","report","pri","cat","type"].forEach(k => document.getElementById("nw-"+k).value = keep[k]); document.getElementById("nw-loc").value = keep.loc;
      document.getElementById("nw-by").innerHTML = staffOptions(keep.loc, keep.by); document.getElementById("nw-asset").innerHTML = assetOptions(keep.loc, keep.asset); return; }
    const id = `WO-${S.next.wo++}`, cat = val("nw-cat");
    const w = {id, type:val("nw-type"), title, pri:val("nw-pri"), cat, loc, by:val("nw-by"), asset:val("nw-asset")||null, created:Date.now(), report,
      status:"New", symptoms:"", findings:"", actions:"", resolution:"", faultAt:null, waiting:null, confirmed:false, checklist:TEMPLATES[cat].map(t=>({t,done:false,r:""}))};
    S.wos[id] = w; logWO(w, `Reported by ${S.staff[w.by].name}: ${title}`); save(); flash(`${id} created. Start work when you get to ${locLabel(L(loc))}.`); location.hash = `#/wo/${id}`; return;
  }
  if (a==="receive"){ receiveSubmit(); return; }
  if (a.startsWith("dp-")){ const x = S.assets[currentId(/^#\/asset\/([^/?]+)/)]; if (x) deployAction(a, x); return; }
  const w = currentWO(); if (!w) return;
  if (a==="swap"){ swapAction(w); return; }
  if (a==="part"){ partAction(w); return; }
  if (a==="start"){ flash("Work order started."); act(w, "Started work", x => { x.status = "In Progress"; x.started = Date.now(); }); }
  if (a==="resume"){ flash("Back in progress."); act(w, "Resumed work", x => { x.status = "In Progress"; x.waiting = null; }); }
  if (a==="wait"){ const r = val("waitreason"); flash(`Set to waiting: ${r}. It moved to the Waiting list.`); act(w, `Set to Waiting: ${r}`, x => { x.status = "Waiting"; x.waiting = {reason:r, since:Date.now()}; }); }
  if (a==="resolve"){ if (!w.resolution.trim()){ woErr = "Write what fixed it under Result before resolving."; route(); document.getElementById("f-resolution").focus(); return; }
    flash("Resolved. Confirm the fix with the staff member, then close it."); act(w, `Resolved: ${w.resolution.trim()}`, x => { x.status = "Resolved"; x.resolvedAt = Date.now(); }); }
  if (a==="close"){ if (!w.confirmed){ woErr = "Tick the box once the staff member confirms it's fixed."; route(); return; } flash("Work order closed."); act(w, "Closed after confirming with staff", x => { x.status = "Closed"; x.closedAt = Date.now(); }); }
  if (a==="reopen"){ flash("Work order reopened."); act(w, "Reopened", x => { x.status = "In Progress"; x.resolvedAt = null; x.closedAt = null; x.confirmed = false; }); }
  if (a==="addstep"){ const t = val("newstep").trim(); if (!t) return; flash("Step added."); act(w, `Added step: ${t}`, x => x.checklist.push({t, done:false, r:""})); }
  if (a==="fault"){ const as = S.assets[w.asset], p = (as.path || buildPath(as))[+b.dataset.i], i = +b.dataset.i;
    if (w.faultAt===i){ flash("Problem location cleared."); act(w, `Cleared problem location: ${p.k}`, x => x.faultAt = null); }
    else { flash(`Problem marked at the ${p.k.toLowerCase()} (${p.v}).`); act(w, `Problem found at ${p.k}: ${p.v}`, x => x.faultAt = i); } }
});

});
main.addEventListener("keydown", e => {
  if (e.key==="Enter" && e.target.id==="newstep"){ e.preventDefault(); main.querySelector('[data-act="addstep"]').click(); }
  if (e.key==="Enter" && e.target.id==="sq"){ e.preventDefault(); main.querySelector('[data-act="search"]').click(); }
});
const resetBtn = document.getElementById("reset"); let armTimer;
resetBtn.addEventListener("click", () => {
  if (!resetBtn.classList.contains("arm")){ resetBtn.classList.add("arm"); resetBtn.textContent = "Click again to reset everything";
    armTimer = setTimeout(() => { resetBtn.classList.remove("arm"); resetBtn.textContent = "Reset demo data"; }, 4000); return; }
  clearTimeout(armTimer); try{ localStorage.removeItem(KEY); }catch(e){}
  S = seed(); save(); Q = {q:"",cat:"",tab:"open"}; SF = {q:"",group:""}; AF = {q:"",cls:"",status:"active"};
  resetBtn.classList.remove("arm"); resetBtn.textContent = "Reset demo data"; flash("Demo data reset to the starting state."); if (location.hash==="#/queue") route(); else location.hash = "#/queue";
});
